<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${subject}">TutorIn Notification</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { background-color: #2563eb; padding: 24px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        .content { padding: 32px 24px; color: #374151; line-height: 1.6; font-size: 16px; }
        .otp-box { background-color: #f3f4f6; border-left: 4px solid #2563eb; padding: 16px; margin: 24px 0; font-weight: bold; }
        .footer { background-color: #f9fafb; padding: 16px; text-align: center; color: #9ca3af; font-size: 12px; border-top: 1px solid #e5e7eb; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>TutorIn</h1>
    </div>
    <div class="content">
        <h2 th:text="${subject}" style="color: #111827; font-size: 20px; margin-top: 0;">Subject</h2>

        <div class="otp-box">
            <span th:text="${body}">Message content will appear here.</span>
        </div>

        <p>If you did not request this action, please secure your account immediately or contact support.</p>
        <p>Best regards,<br><strong>The TutorIn Team</strong></p>
    </div>
    <div class="footer">
        &copy; 2026 TutorIn. All rights reserved. <br>
    </div>
</div>
</body>
</html>
